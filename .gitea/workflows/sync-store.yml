name: sync-store

# push 到 main（且动到脚本/说明文件）时，把 zy.js 推到脚本猫商店 #6006
on:
  push:
    branches: [main, master]
    paths:
      - 'zy.js'
      - 'release-notes/**'
      - 'CHANGELOG.md'
      - 'sc_sync.py'
      - '.gitea/workflows/sync-store.yml'
  workflow_dispatch: {}

jobs:
  push-store:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 看版本差
        run: python3 sc_sync.py --check

      - name: 推送到脚本猫
        env:
          SCRIPTCAT_WEBHOOK: ${{ secrets.SCRIPTCAT_WEBHOOK }}
        run: |
          python3 sc_sync.py --push --dry
          python3 sc_sync.py --push
