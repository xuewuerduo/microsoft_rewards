name: sync-store

# 本环境没有 act_runner，push 触发只会让工作流一直排队，故去掉 push 触发器。
# 发版走本地 webhook：python tools/sc_sync.py --push --url <webhook地址>
# 本文件只保留手动入口（workflow_dispatch），将来若配了 runner 也能手动点一次。
on:
  workflow_dispatch: {}

jobs:
  push-store:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 看版本差
        run: python3 tools/sc_sync.py --check

      - name: 推送到脚本猫
        env:
          SCRIPTCAT_WEBHOOK: ${{ secrets.SCRIPTCAT_WEBHOOK }}
        run: |
          python3 tools/sc_sync.py --push --dry
          python3 tools/sc_sync.py --push
